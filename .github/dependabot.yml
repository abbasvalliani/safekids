version: 2
# npm version updates are handled by Renovate (with release-age cooldowns), not
# Dependabot. Dependabot security alerts/updates stay enabled at the repo level.
# Nothing in this repo auto-merges Dependabot PRs.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 25
    schedule:
      interval: 'daily'
