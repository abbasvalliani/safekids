# ── RUNS IN THE CLUSTER (self-hosted ARC runners) ───────────────────────────
# Ported from GitHub-hosted `ubuntu-latest` to `runs-on: homelab-safekids`.
# The runner image ships the actions runner, git, curl and the docker/buildx
# CLIs — and nothing else. Whatever toolchain a job needs it installs itself
# (nodejs.org, registry.npmjs.org, pypi.org, files.pythonhosted.org and
# github.com are all on the runner's default-deny egress allowlist).
name: Dependabot Merged Release

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  auto-merge:
    # stays GitHub-hosted: needs the `gh` CLI, which the ARC runner image does
    # not ship (and cannot install — the pod is non-root with no sudo). The job
    # is a single API call, so it costs seconds of hosted time.
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}} # Detect that the PR author is dependabot
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL" # Use Github CLI to merge automatically the PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GIT_MERGE_TOKEN }}
  build:
    runs-on: homelab-safekids
    # Raised from 15: same cause as build.yml — NX_NO_CLOUD means `nx build`
    # no longer hits the Nx Cloud remote cache and is computed from scratch.
    timeout-minutes: 30
    needs: auto-merge
    env:
      # nx.json carries an nxCloudAccessToken, so nx phones cloud.nx.app for
      # remote caching. That host is not on the runner's default-deny egress
      # allowlist, so disable the cloud client rather than open a hole for a
      # cache. Same setting booknok's build already uses. Local cache still works.
      NX_NO_CLOUD: 'true'
      # download.cypress.io is NOT on the runner's default-deny egress
      # allowlist, so cypress's postinstall aborts the whole `pnpm install`
      # (ELIFECYCLE). Nothing CI runs needs the binary: `test` runs jest/vite
      # on eight lib+app projects and `build` runs build targets — the two
      # cypress projects (ml-api-web-demo-e2e, main-website-react-e2e) have no
      # target either script invokes. Skip the download rather than open a
      # hole in the allowlist for a binary CI never executes.
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      # git-lfs is NOT baked into the ARC runner image, and the pod runs as a
      # non-root user (uid 1001) with no sudo, so apt is unavailable at run
      # time. Fetch the release tarball instead: github.com and
      # *.githubusercontent.com are both on the runner egress allowlist.
      # MUST precede checkout — `lfs: true` shells out to `git lfs`.
      - name: Install git-lfs (not in the runner image)
        run: |
          set -euo pipefail
          LFS_VERSION=3.5.1
          curl -fsSL -o /tmp/git-lfs.tgz \
            "https://github.com/git-lfs/git-lfs/releases/download/v${LFS_VERSION}/git-lfs-linux-amd64-v${LFS_VERSION}.tar.gz"
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/git-lfs-${LFS_VERSION}/git-lfs" "$HOME/.local/bin/git-lfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-lfs" version

      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0

      - name: Init git user
        run: |
          git config --local user.email "abbas@safekids.ai"
          git config --local user.name "Release Workflow"

      - name: Checkout LFS objects
        run: git lfs pull

      # ── Toolchain order matters on the lean ARC runner image ──────────────
      # The image ships NO node, so actions/setup-node MUST run FIRST:
      # pnpm/action-setup's installer needs a node on PATH. That in turn forces
      # `cache: 'pnpm'` off setup-node, because its cache resolver shells out to
      # `pnpm store path` and pnpm does not exist yet at that point (circular).
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@safekids-ai'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `version: latest` resolved to pnpm 11.x, which needs Node >= 22.13
      # (node:sqlite) and aborts with ERR_UNKNOWN_BUILTIN_MODULE on Node 20.
      # Pre-existing latent defect; let `packageManager` (pnpm@9.1.0) win.
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Release
        run: |
          npx nx build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
