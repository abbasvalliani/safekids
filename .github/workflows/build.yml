# ── RUNS IN THE CLUSTER (self-hosted ARC runners) ───────────────────────────
# Ported from GitHub-hosted `ubuntu-latest` to `runs-on: homelab-safekids`.
# The runner image ships the actions runner, git, curl and the docker/buildx
# CLIs — and nothing else. Whatever toolchain a job needs it installs itself
# (nodejs.org, registry.npmjs.org, pypi.org, files.pythonhosted.org and
# github.com are all on the runner's default-deny egress allowlist).
name: Build and Test

on:
  push:
    branches:
      - main
  # Added by the self-hosted-CI port: without a pull_request trigger this
  # workflow only ever ran post-merge, so the runner migration could not be
  # validated on the PR that makes it. Mirrors build.yml in mail-agent.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: homelab-safekids
    # Raised from 10 by the self-hosted-CI port. TWO separate causes, and the
    # first diagnosis was WRONG - recorded so it is not repeated.
    #
    #  - The stalls were NOT slowness. The runner pod is capped at 6Gi of
    #    memory while exposing 8 CPUs, nx and jest size their worker pools
    #    from the CPU count, and the pod was OOMKilled (exit 137, observed
    #    directly on homelab-safekids-h78dz-runner-fq444). A dead runner
    #    surfaces as a job timeout or as "the self-hosted runner lost
    #    communication with the server", which reads exactly like a hang.
    #    NX_PARALLEL below and --maxWorkers at the test call site are the
    #    actual fix; this timeout is not.
    #  - Separately, the job IS genuinely slower: cloud.nx.app is not on the
    #    runner's default-deny egress allowlist, so NX_NO_CLOUD is set and
    #    nothing comes from the Nx Cloud remote cache. safekids' last green
    #    main build took 2m06s and booknok's 4m33s because they were largely
    #    cache hits; computed from scratch this does not fit in 10 minutes.
    timeout-minutes: 30
    env:
      # nx.json carries an nxCloudAccessToken, so nx phones cloud.nx.app for
      # remote caching. That host is not on the runner's default-deny egress
      # allowlist, so disable the cloud client rather than open a hole for a
      # cache. Same setting booknok's build already uses. Local cache still works.
      NX_NO_CLOUD: 'true'
      # download.cypress.io is NOT on the runner's default-deny egress
      # allowlist, so cypress's postinstall aborts the whole `pnpm install`
      # (ELIFECYCLE). Nothing CI runs needs the binary: `test` runs jest/vite
      # on eight lib+app projects and `build` runs build targets — the two
      # cypress projects (ml-api-web-demo-e2e, main-website-react-e2e) have no
      # target either script invokes. Skip the download rather than open a
      # hole in the allowlist for a binary CI never executes.
      CYPRESS_INSTALL_BINARY: '0'
      # 8 CPUs visible, 6Gi of memory. nx sizes its task pool from the CPU
      # count, so `run-many` ran up to 8 concurrent builds/jest processes and
      # the pod was OOMKilled. Serialise nx tasks; the per-jest worker cap is
      # applied at the test call site.
      NX_PARALLEL: '1'
    permissions:
      contents: read
      packages: write
    steps:
      # git-lfs is NOT baked into the ARC runner image, and the pod runs as a
      # non-root user (uid 1001) with no sudo, so apt is unavailable at run
      # time. Fetch the release tarball instead: github.com and
      # *.githubusercontent.com are both on the runner egress allowlist.
      # MUST precede checkout — `lfs: true` shells out to `git lfs`.
      - name: Install git-lfs (not in the runner image)
        run: |
          set -euo pipefail
          LFS_VERSION=3.5.1
          curl -fsSL -o /tmp/git-lfs.tgz \
            "https://github.com/git-lfs/git-lfs/releases/download/v${LFS_VERSION}/git-lfs-linux-amd64-v${LFS_VERSION}.tar.gz"
          tar -xzf /tmp/git-lfs.tgz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/git-lfs-${LFS_VERSION}/git-lfs" "$HOME/.local/bin/git-lfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-lfs" version

      - name: Checkout github repo (+ download lfs dependencies)
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 0

      - name: Init git user
        run: |
          git config --local user.email "abbas@safekids.ai"
          git config --local user.name "Release Workflow"

      - name: Checkout LFS objects
        run: git lfs pull

      # ── Toolchain order matters on the lean ARC runner image ──────────────
      # The image ships NO node, so actions/setup-node MUST run FIRST:
      # pnpm/action-setup's installer needs a node on PATH. That in turn forces
      # `cache: 'pnpm'` off setup-node, because its cache resolver shells out to
      # `pnpm store path` and pnpm does not exist yet at that point (circular).
      # The cache only saved a registry hop and the runner is LAN-local, so the
      # loss is negligible.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@safekids-ai'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `version: latest` resolved to pnpm 11.x, which requires Node >= 22.13
      # (it imports node:sqlite) and so aborts with ERR_UNKNOWN_BUILTIN_MODULE on
      # the Node 20 above. PRE-EXISTING latent defect, not caused by the runner
      # move — the last green main build predates pnpm 11. Dropping the override
      # lets package.json's `packageManager` (pnpm@9.1.0) win, which is the version
      # the committed lockfile was written with.
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step-level bounds, deliberately shorter than the job's. A JOB timeout
      # makes GitHub discard the log entirely, which is why the first stall
      # here was undiagnosable; a STEP timeout fails the step and the job still
      # finishes normally, so the log survives. Split build from test so the
      # log says which of the two is responsible.
      - name: Build
        timeout-minutes: 12
        run: pnpm run build

      # --maxWorkers=2: jest defaults to one worker per CPU (8 here) and each
      # worker is a full node process, which is what exhausted the pod's 6Gi.
      - name: Test
        timeout-minutes: 12
        run: pnpm run test -- --maxWorkers=2

