name: Build and Deploy DEMO

on:
  release:
    types: [created]

# Least privilege: the job only checks out code; Harbor auth uses REGISTRY_TOKEN.
permissions:
  contents: read

jobs:
  build_and_push:
    environment: prod
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE: ${{ vars.REGISTRY_HOST }}/safekids-ai/demo
      RELEASE_TAG: ${{ github.ref_name }} # e.g. v1.2.3
      SHORT_SHA: ${{ github.sha != '' && github.sha || 'unknown' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive semver tags
        id: semver
        run: |
          TAG="${RELEASE_TAG#v}"         # strip leading v if present -> 1.2.3
          echo "full=v${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (multi tags)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ml-api-web-demo/Dockerfile
          push: true
          build-args: |
            GIT_TAG=${{ steps.semver.outputs.full }}
          # Immutable tags only: the release version + git sha. No moving tags
          # (:latest, :vX, :vX.Y) -- deploys pin an exact version (infra
          # deploy-app-safekids safekids:imageTag).
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.semver.outputs.full }}
            ${{ env.IMAGE_BASE }}:git-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.title=snowslawnpro
            org.opencontainers.image.version=${{ steps.semver.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          provenance: true
          sbom: true

      - name: Output image digest
        run: echo "Digest=${{ steps.build.outputs.digest }}"

      # --- Release scan + SBOM (P2, report-only) ---------------------------
      # Trivy is installed from its pinned, immutable GitHub release and
      # checked against a hard-coded SHA-256 (not via aquasecurity/trivy-action:
      # see the March 2026 Trivy supply-chain advisory GHSA-69fq-xp46-6x23).
      # The scan reads the image BY DIGEST from Harbor, reusing the
      # docker/login-action credentials in ~/.docker/config.json.
      # Report-only: findings never fail the release (exit-code 0), and a
      # scanner outage doesn't either (continue-on-error).
      - name: Install Trivy (pinned release, checksum-verified)
        id: trivy_install
        continue-on-error: true
        env:
          TRIVY_VERSION: "0.76.0"
          TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/trivy"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          mkdir -p "${dir}"
          curl -fsSL --retry 3 -o "${dir}/${tarball}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}" trivy
          "${dir}/trivy" --version
          echo "${dir}" >> "$GITHUB_PATH"

      - name: Trivy scan + SBOM (report-only)
        if: steps.trivy_install.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE_BASE }}@${{ steps.build.outputs.digest }}
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_NO_PROGRESS: "true"
          TRIVY_IMAGE_SRC: remote
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release-scan"
          mkdir -p "${out}"
          # Fixable CRITICAL/HIGH only; never fails the job.
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 0 --format json --output "${out}/trivy-vulns.json" "${IMAGE_REF}"
          trivy convert --format table "${out}/trivy-vulns.json"
          # Full-package CycloneDX SBOM of the same digest.
          trivy image --format cyclonedx --output "${out}/sbom.cdx.json" "${IMAGE_REF}"
          {
            echo "### Trivy (report-only): \`${IMAGE_REF}\`"
            echo
            echo "Fixable vulnerabilities only (\`--ignore-unfixed\`), CRITICAL and HIGH."
            echo
            echo "| Severity | Findings | Unique CVEs |"
            echo "| --- | --- | --- |"
            for sev in CRITICAL HIGH; do
              jq -r --arg s "${sev}" '
                [.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] as $v
                | "| \($s) | \($v | length) | \($v | map(.VulnerabilityID) | unique | length) |"
              ' "${out}/trivy-vulns.json"
            done
            echo
            echo "CycloneDX SBOM + JSON report are attached as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM + scan report
        if: steps.trivy_install.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-scan-${{ steps.semver.outputs.full }}
          path: ${{ runner.temp }}/release-scan/
          if-no-files-found: warn
          retention-days: 90
#      - name: Trigger Coolify deployment via webhook
#        uses: fjogeleit/http-request-action@v1
#        with:
#          url: ${{vars.COOLIFY_URL}}/api/v1/deploy?uuid=${{secrets.COOLIFY_APP_DEMO_UUID}}&force=true
#          method: GET
#          bearerToken: ${{secrets.COOLIFY_API_TOKEN}}
