name: Build and Deploy API

on:
  release:
    types: [created]

jobs:
  build_and_push:
    environment: prod
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE: ${{ vars.REGISTRY_HOST }}/safekids-ai/api
      RELEASE_TAG: ${{ github.ref_name }} # e.g. v1.2.3
      SHORT_SHA: ${{ github.sha != '' && github.sha || 'unknown' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Harbor
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive semver tags
        id: semver
        run: |
          TAG="${RELEASE_TAG#v}"         # strip leading v if present -> 1.2.3
          echo "full=v${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (multi tags)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ml-api/Dockerfile
          push: true
          build-args: |
            GIT_TAG=${{ steps.semver.outputs.full }}
          # Immutable tags only: the release version + git sha. No moving tags
          # (:latest, :vX, :vX.Y) -- deploys pin an exact version (infra
          # deploy-app-safekids safekids:imageTag).
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.semver.outputs.full }}
            ${{ env.IMAGE_BASE }}:git-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.title=safekids-api
            org.opencontainers.image.version=${{ steps.semver.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
          provenance: true
          sbom: true

      - name: Output image digest
        run: echo "Digest=${{ steps.build.outputs.digest }}"

