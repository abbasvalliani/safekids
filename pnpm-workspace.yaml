  # glob 9.0.0-14.0.1 (GHSA-3g3m-2fjr-6pw4, AbortSignal bypass): jest 30,
  # test-exclude 7, stylus, sucrase use the named glob/globSync API, unchanged in 14.
  'glob@>=9 <14.0.2': 14.0.4
  # minimatch < 11.0.1 (GHSA-g3hv-75wg-m249, globparts DoS), every major line.
  # >= 4 consumers (nx, eslint, typescript-eslint, @swc/cli, glob 14, filelist)
  # use named exports; v3 consumers get the callable facade below.
  'minimatch@>=4 <11.0.1': 11.0.5
  # Consumers whose patched dependency changed its export/call style get a small
  # facade (tools/compat/*, installed as a copy via file:) over the patched
  # release. The Dockerfiles COPY tools/compat before `pnpm install`.
  'minimatch@<4': file:./tools/compat/minimatch3
  # image-size <= 2.0.2 (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq): less >= 4.7
  # dropped image-size (probe-image-size); 4.8.1 is the newest @nx/webpack allows.
  '@nx/webpack>less': 4.8.1
  'metro>image-size': file:./tools/compat/image-size1
  # file-type 13 - 21.3.0 (GHSA-5v7r-6r5c-r473) and phin < 3.7.1
  # (GHSA-x565-32qp-m3vf) via jimp 0.16 (@andreekeberg/imagedata, vision-js-node,
  # so they ship in the api image). These two facades have no dependencies: Nx 23's
  # pruned api lockfile (generatePackageJson) drops the dependency edges of a file:
  # package whose snapshot carries a peer suffix, and then fails the build.
  '@jimp/core>file-type': file:./tools/compat/file-type16
  '@jimp/core>phin': file:./tools/compat/phin2
  # extract-zip (GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv, no fix): puppeteer 25
  # (@puppeteer/browsers 3) unpacks with modern-tar instead. The deprecated
  # @types/puppeteer stub (optional peer of puppeteer-extra) pins its own puppeteer.
  # 25.12.0: from 25.13 on, chromium-bidi (157.x) is published without the
  # provenance earlier releases had (trustPolicy no-downgrade rejects it).
  '@types/puppeteer>puppeteer': 25.12.0

# Every dependency with an install script, reviewed: NONE needs it. Build + unit
# tests pass with all of them denied, and the Dockerfiles already install with
# --ignore-scripts. Native ones (esbuild, @swc/core, sharp, nx, @parcel/watcher,
# msgpackr-extract, onnxruntime-node CPU) ship prebuilt binaries as optional
# per-platform packages; the rest are binary downloads not used by build/test
# (cypress, puppeteer, @sentry/cli), telemetry/funding banners (@scarf/scarf,
# @nestjs/core, aws-sdk) or a version check (protobufjs). A new package with an
# install script fails install (strictDepBuilds) until it is reviewed here.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@sentry/cli': false
  '@swc/core': false
  'aws-sdk': false
  'cypress': false
  'esbuild': false
  'msgpackr-extract': false
  'nx': false
  'onnxruntime-node': false
  'protobufjs': false
  'puppeteer': false
  'sharp': false
  # jest 30 (jest-resolve): napi-postinstall only re-downloads the native binding
  # when the per-platform optional package is missing; the optional packages
  # ship it prebuilt, so the script is not needed.
  'unrs-resolver': false

strictDepBuilds: true
minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Exact versions already locked before this policy was enabled whose publish
# lacks the provenance/trusted-publisher attestation that an EARLIER release of
# the same package had (legit maintainer publishes, e.g. old-major backports).
# Pinned to the exact version so any NEW release of these is still checked.
trustPolicyExclude:
  - '@octokit/endpoint@9.0.5'
  - '@oxc-resolver/binding-darwin-arm64@1.12.0'
  - '@oxc-resolver/binding-darwin-x64@1.12.0'
  - '@oxc-resolver/binding-linux-arm64-gnu@1.12.0'
  - '@oxc-resolver/binding-linux-x64-gnu@1.12.0'
  - '@oxc-resolver/binding-win32-arm64-msvc@1.12.0'
  - '@oxc-resolver/binding-win32-x64-msvc@1.12.0'
  - '@reduxjs/toolkit@2.5.0'
  - '@swc/core@1.10.2'
  - 'chokidar@4.0.3'
  - 'css-declaration-sorter@6.4.1'
  - 'detect-port@1.6.1'
  - 'react-redux@9.2.0'
  - 'reselect@5.1.1'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
  - 'tailwind-merge@2.6.0'
  - 'undici-types@6.20.0'
  - 'undici@6.21.0'
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: esbuild@0.25.0
  - esbuild@0.25.0
