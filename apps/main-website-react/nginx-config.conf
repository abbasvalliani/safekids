server {
  # Non-root: the image runs as the unprivileged nginx user (uid 101), which
  # cannot bind ports below 1024, so nginx listens on 8080.
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind the ingress the public port is 443/80, not 8080. Keep the port out of
  # absolute redirects (e.g. /how-it-works-privacy -> /how-it-works) exactly as
  # before, when nginx listened on 80 and omitted it as the default port.
  port_in_redirect off;

  # --- Redirects ---
  location = /how-it-works-privacy {
    return 301 /how-it-works;
  }

  # --- Static content ---
  location / {
    # Try exact file, then about.html, then about/index.html — no redirect needed
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
