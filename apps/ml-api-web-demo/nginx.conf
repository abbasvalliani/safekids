server {
    # Non-root: the image runs as the unprivileged nginx user (uid 101), which
    # cannot bind ports below 1024, so nginx listens on 8080.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html/;

    # Behind the ingress the public port is 443/80, not 8080. Keep the port out
    # of absolute redirects, exactly as before when nginx listened on 80.
    port_in_redirect off;

    location / {
      index index.html;
      try_files $uri $uri/ /index.html =404;
    }
}
