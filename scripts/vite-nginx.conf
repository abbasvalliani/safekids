server {
    # Non-root: the image runs as the unprivileged nginx user (uid 101), which
    # cannot bind ports below 1024, so nginx listens on 8080.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html/;
    port_in_redirect off;

    location / {
      index index.html;
      try_files $uri $uri/ /index.html =404;
    }
}
